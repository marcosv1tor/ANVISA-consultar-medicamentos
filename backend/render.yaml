services:
  - type: web
    name: medware-backend
    env: node
    plan: free
    buildCommand: npm install && mkdir -p .cache/puppeteer && node node_modules/puppeteer/lib/cjs/puppeteer/node/cli.js browsers install chrome
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /opt/render/project/src/.cache/puppeteer/chrome/linux-*/chrome-linux*/chrome
      # Removendo PUPPETEER_SKIP_CHROMIUM_DOWNLOAD para usar Chromium padrão
      # - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
      #   value: true
    region: oregon
    scaling:
      minInstances: 1
      maxInstances: 1
    healthCheckPath: /health
    disk:
      name: medware-backend-disk
      size: 1GB
      mountPath: /opt/render/project/src